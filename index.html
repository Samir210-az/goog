<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Denver II – 120+ Maddə, Yaşa uyğun filtr, Ətraflı Hesabat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #eef2f5 0%, #d9e4ec 100%); margin: 0; padding: 12px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 1400px; margin: 0 auto; background: rgba(255,255,255,0.98); border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); padding: 16px 20px 24px; }
        h1 { font-size: 1.7rem; background: linear-gradient(135deg, #1e6b3b, #2b9e4a); -webkit-background-clip: text; background-clip: text; color: transparent; border-left: 5px solid #1e6b3b; padding-left: 18px; margin-top: 0; display: inline-block; }
        .tabs { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; border-bottom: 1px solid #ccc; }
        .tab-btn { background: none; border: none; padding: 8px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 40px 40px 0 0; color: #2c5a2e; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .tab-btn i { font-size: 1.1rem; }
        .tab-btn.active { background: #1e6b3b; color: white; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        .tab-pane { display: none; animation: fade 0.2s ease; }
        .tab-pane.active { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .info-panel { background: #e8f3ec; padding: 12px 20px; border-radius: 32px; display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: flex-end; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .info-field { flex: 1; min-width: 130px; }
        .info-field label { font-weight: bold; font-size: 0.75rem; color: #1e6b3b; display: block; margin-bottom: 5px; }
        .info-field input, .info-field textarea { width: 100%; padding: 10px 14px; border-radius: 40px; border: 1px solid #cbdcc2; background: white; font-size: 0.85rem; font-family: inherit; transition: 0.2s; }
        .info-field input:focus, .info-field textarea:focus { border-color: #1e6b3b; outline: none; box-shadow: 0 0 0 2px rgba(30,107,59,0.2); }
        button { background: #1e6b3b; color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; margin: 4px 4px 0 0; font-size: 0.85rem; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
        button i { font-size: 1rem; }
        button:hover { background: #0f4a28; transform: scale(1.02); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-secondary { background: #4a6a5e; }
        .status { background: #fcf8e8; padding: 12px 16px; border-radius: 28px; margin: 12px 0; border-left: 5px solid #e9b35f; font-size: 0.85rem; }
        .table-wrapper { overflow-x: auto; overflow-y: auto; border: 1px solid #d4dfe3; border-radius: 24px; margin-top: 20px; max-height: 70vh; background: white; }
        .test-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; min-width: 900px; }
        .test-table th, .test-table td { border: 1px solid #d0dbdf; padding: 8px 5px; text-align: center; vertical-align: middle; }
        .test-table thead th { position: sticky; top: 0; background: #d9e8da; z-index: 20; }
        .domain-row { background: #cbddce; font-weight: bold; text-align: left; }
        .checkbox-cell input { width: 18px; height: 18px; cursor: pointer; accent-color: #1e6b3b; margin: 0; }
        .search-box { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .search-box input { flex: 2; padding: 10px 18px; border-radius: 40px; border: 1px solid #ccc; transition: 0.2s; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-card { background: #f0f7f0; padding: 16px; border-radius: 28px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: 0.2s; }
        .stat-card:hover { transform: translateY(-3px); background: #e8f4e8; }
        .archive-row { cursor: pointer; transition: 0.1s; }
        .archive-row:hover { background: #e0f0e0; }
        .btn-small { padding: 6px 14px; font-size: 0.7rem; margin: 0; border-radius: 30px; }
        .guidance-content { background: #f9faf6; padding: 20px; border-radius: 28px; line-height: 1.5; font-size: 0.9rem; margin-top: 20px; }
        .guidance-content h3 { color: #1e6b3b; margin-top: 20px; }
        footer { margin-top: 30px; text-align: center; font-size: 0.8rem; border-top: 1px solid #ddd; padding-top: 20px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 20px; }
        .social-link { background: #ffffff; border: 2px solid #e4405f; color: #e4405f; text-decoration: none; font-weight: bold; padding: 8px 20px; border-radius: 40px; display: inline-flex; align-items: center; gap: 10px; transition: all 0.3s; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .social-link:hover { background: #e4405f; color: white; transform: scale(1.05); box-shadow: 0 6px 14px rgba(228,64,95,0.3); }
        .copyright { color: #5e7c6b; }
        @media (max-width: 700px) { .container { padding: 12px; } .test-table { font-size: 0.65rem; } button { padding: 6px 14px; } }
    
/* ═══════════════════════════════════════════════════════
   UI UX PRO MAX — Denver II Glassmorphism & Parallax
   Struktur toxunulmaz · yalnız vizual layer
═══════════════════════════════════════════════════════ */

/* ── BODY BG ENHANCED ── */
body{
  background:
    radial-gradient(ellipse 120% 55% at 90% -10%, rgba(46,158,74,0.18), transparent 55%),
    radial-gradient(ellipse 100% 65% at 5% 110%, rgba(30,107,59,0.12), transparent 55%),
    linear-gradient(135deg, #eef2f5 0%, #d9e4ec 100%) !important;
  min-height:100vh;
}

/* ── CONTAINER GLASS ── */
.container{
  background:rgba(255,255,255,0.72) !important;
  backdrop-filter:blur(24px) saturate(1.7) !important;
  -webkit-backdrop-filter:blur(24px) saturate(1.7) !important;
  border:1.5px solid rgba(46,158,74,0.15) !important;
  box-shadow:0 24px 64px rgba(30,107,59,0.14),0 2px 0 rgba(255,255,255,0.9) inset !important;
}

/* ── TABS GLASS ── */
.tabs{
  background:rgba(255,255,255,0.55) !important;
  backdrop-filter:blur(12px) !important;
  -webkit-backdrop-filter:blur(12px) !important;
  border-radius:16px !important;
  padding:6px !important;
  border:1.5px solid rgba(46,158,74,0.15) !important;
  box-shadow:0 4px 16px rgba(30,107,59,0.08) !important;
  gap:6px !important;
}
.tab-btn{
  border-radius:12px !important;
  border-bottom:none !important;
  transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s,box-shadow .25s !important;
}
.tab-btn:hover:not(.active){
  background:rgba(46,158,74,0.10) !important;
  transform:translateY(-2px) !important;
}
.tab-btn.active{
  background:linear-gradient(135deg,#1e6b3b,#2b9e4a) !important;
  box-shadow:0 6px 20px rgba(30,107,59,0.35),0 2px 0 rgba(255,255,255,0.2) inset !important;
  transform:translateY(-2px) !important;
}

/* ── INFO PANEL GLASS ── */
.info-panel{
  background:rgba(232,243,236,0.65) !important;
  backdrop-filter:blur(16px) saturate(1.5) !important;
  -webkit-backdrop-filter:blur(16px) saturate(1.5) !important;
  border:1.5px solid rgba(46,158,74,0.18) !important;
  box-shadow:0 8px 32px rgba(30,107,59,0.08),0 1.5px 0 rgba(255,255,255,0.8) inset !important;
}

/* ── INPUTS GLASS ── */
.info-field input,
.info-field textarea,
.info-field select,
input[type="text"],
input[type="number"],
input[type="date"],
select,
textarea{
  background:rgba(255,255,255,0.75) !important;
  backdrop-filter:blur(8px) !important;
  -webkit-backdrop-filter:blur(8px) !important;
  border:1.5px solid rgba(46,158,74,0.2) !important;
  transition:border-color .2s,box-shadow .2s,background .2s !important;
}
.info-field input:focus,
.info-field textarea:focus,
.info-field select:focus,
input:focus,select:focus,textarea:focus{
  background:rgba(255,255,255,0.96) !important;
  border-color:#1e6b3b !important;
  box-shadow:0 0 0 4px rgba(30,107,59,0.14),0 4px 16px rgba(30,107,59,0.08) !important;
  outline:none !important;
}

/* ── BUTTONS ENHANCED ── */
button:not(.tab-btn){
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s !important;
}
button:not(.tab-btn):hover{
  transform:translateY(-3px) scale(1.03) !important;
}
button:not(.tab-btn):active{
  transform:scale(.96) !important;
}

/* ── TABLE GLASS ── */
.test-table,
table{
  border-collapse:separate !important;
  border-spacing:0 4px !important;
}
.test-table tbody tr,
table tbody tr{
  background:rgba(255,255,255,0.62) !important;
  backdrop-filter:blur(8px) !important;
  -webkit-backdrop-filter:blur(8px) !important;
  transition:background .2s,transform .2s,box-shadow .2s !important;
  border-radius:10px !important;
}
.test-table tbody tr:hover,
table tbody tr:hover{
  background:rgba(232,243,236,0.85) !important;
  transform:scale(1.005) !important;
  box-shadow:0 4px 16px rgba(30,107,59,0.10) !important;
}
.test-table thead tr,
table thead tr{
  background:linear-gradient(135deg,rgba(30,107,59,0.9),rgba(43,158,74,0.85)) !important;
  backdrop-filter:blur(12px) !important;
  -webkit-backdrop-filter:blur(12px) !important;
}

/* ── RESULT / SCORE CARDS GLASS ── */
.result-badge,
.score-card,
.stat-box,
.summary-box,
[class*="result"],
[class*="score"],
[class*="report"]{
  background:rgba(255,255,255,0.68) !important;
  backdrop-filter:blur(20px) saturate(1.6) !important;
  -webkit-backdrop-filter:blur(20px) saturate(1.6) !important;
  border:1.5px solid rgba(46,158,74,0.18) !important;
  box-shadow:0 12px 40px rgba(30,107,59,0.10),0 1.5px 0 rgba(255,255,255,0.85) inset !important;
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s !important;
}
[class*="result"]:hover,
[class*="score"]:hover{
  transform:translateY(-5px) !important;
  box-shadow:0 20px 56px rgba(30,107,59,0.16) !important;
}

/* ── PRINT BUTTON / SOCIAL LINKS ── */
.social-link,.print-btn,[class*="export"],[class*="print"]{
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s !important;
}
.social-link:hover{
  transform:scale(1.06) translateY(-2px) !important;
}

/* ── MODAL / OVERLAY GLASS ── */
[class*="modal"],[class*="overlay"],[class*="dialog"]{
  backdrop-filter:blur(10px) saturate(1.3) !important;
  -webkit-backdrop-filter:blur(10px) saturate(1.3) !important;
}
[class*="modal-box"],[class*="modal-content"],[class*="dialog-box"]{
  background:rgba(255,255,255,0.85) !important;
  backdrop-filter:blur(28px) saturate(1.8) !important;
  -webkit-backdrop-filter:blur(28px) saturate(1.8) !important;
  border:1.5px solid rgba(46,158,74,0.2) !important;
  box-shadow:0 32px 80px rgba(0,0,0,0.2),0 2px 0 rgba(255,255,255,0.9) inset !important;
}

/* ── FOOTER / COPYRIGHT GLASS ── */
footer,[class*="footer"]{
  position:relative;
}
footer::before,[class*="footer"]::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(30,107,59,0.4),transparent);
}

/* ── SCROLLBAR GREEN ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(30,107,59,0.06);border-radius:5px}
::-webkit-scrollbar-thumb{background:rgba(30,107,59,0.35);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(30,107,59,0.6)}

/* ── PAGE LOAD ANIMATION ENHANCED ── */
@keyframes fadeIn{
  from{opacity:0;transform:translateY(16px) scale(0.98);filter:blur(2px);}
  to{opacity:1;transform:none;filter:blur(0);}
}

/* ── H1 GLOW ── */
h1{
  text-shadow:0 2px 20px rgba(30,107,59,0.15) !important;
  transition:text-shadow .3s !important;
}
h1:hover{
  text-shadow:0 4px 32px rgba(30,107,59,0.28) !important;
}

/* ── CARD/PANEL HOVER LIFT ── */
.info-panel:hover{
  box-shadow:0 16px 48px rgba(30,107,59,0.14),0 2px 0 rgba(255,255,255,0.85) inset !important;
  transform:translateY(-2px);
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s;
}

</style>
</head>

<div class="container">
    <h1><i class="fas fa-child"></i> Denver II İnkişaf Testi <span style="font-size:0.8rem;">(120+ Maddə, Yaşa uyğun filtr, Ətraflı Hesabat)</span></h1>
    <div class="tabs">
        <button class="tab-btn active" data-tab="test"><i class="fas fa-table-list"></i> Test cədvəli</button>
        <button class="tab-btn" data-tab="archive"><i class="fas fa-archive"></i> Arxiv</button>
        <button class="tab-btn" data-tab="stats"><i class="fas fa-chart-line"></i> Statistika</button>
        <button class="tab-btn" data-tab="guidance"><i class="fas fa-book-open"></i> Təlimat</button>

            <div class="info-field"><label><i class="fas fa-calendar-alt"></i> Doğum tarixi</label><input type="date" id="dob"></div>
            <div class="info-field"><label><i class="fas fa-id-card"></i> Qeydiyyat №</label><input type="text" id="regNo" placeholder="Qeydiyyat"></div>
            <div class="info-field"><label><i class="fas fa-user-md"></i> Mütəxəssis adı</label><input type="text" id="specialist" placeholder="Testi keçirən şəxs"></div>
            <div class="info-field" style="flex:2; min-width:200px;">
                <label><i class="fas fa-brain"></i> Psixoloq qeydləri</label>

        <div class="table-wrapper" id="testTableWrapper"></div>

        <div id="archiveList"></div>
    </div>
    <div id="statsPane" class="tab-pane"><button id="calcStatsBtn" class="btn-secondary"><i class="fas fa-chart-simple"></i> Yenilə</button><div id="statsContent" class="stats-grid"></div></div>
    <div id="guidancePane" class="tab-pane"><div class="guidance-content" id="guidanceText"></div></div>
    <footer>
        <a href="https://www.instagram.com/s_akhundoff" target="_blank" rel="noopener noreferrer" class="social-link"><i class="fab fa-instagram"></i> by s_akhundoff</a>
        <div class="copyright">Bütün hüquqları qorunur. 2026</div>
    </footer>

<script>

/* UI UX PRO MAX — Denver II Scroll Magic */
(function(){
  // Body parallax bg
  function denverScroll(){
    var sy = window.scrollY;
    // Subtle body bg parallax
    document.body.style.backgroundPositionY = (-sy * 0.15) + 'px';
    // Container soft parallax
    var cont = document.querySelector('.container');
    if(cont){
      cont.style.backgroundPositionY = 'calc(50% + ' + (sy*0.05) + 'px)';
    }
  }
  window.addEventListener('scroll', denverScroll, {passive:true});

  // Entrance animasiyası — elementlər görünəndə canlanır
  var observed = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        e.target.style.opacity = '1';
        e.target.style.transform = 'translateY(0) scale(1)';
        observed.unobserve(e.target);
      }
    });
  },{threshold:0.08});

  function initReveal(){
    var els = document.querySelectorAll(
      '.info-panel, .tabs, [class*="result"], [class*="score"], [class*="report"], .summary-box, .stat-box'
    );
    els.forEach(function(el){
      el.style.opacity = '0';
      el.style.transform = 'translateY(20px) scale(0.98)';
      el.style.transition = 'opacity .65s cubic-bezier(.22,1,.36,1), transform .65s cubic-bezier(.22,1,.36,1)';
      observed.observe(el);
    });
  }

  // Tab dəyişdikdə yeni elementlər üçün
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      setTimeout(initReveal, 50);
    });
  });

  window.addEventListener('load', function(){
    setTimeout(initReveal, 200);
  });
})();

</script>
